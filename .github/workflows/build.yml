name: Build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            libsdl2-dev \
            libsdl2-image-dev \
            xxd

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Build native Decker
        run: make decker

      - name: Run native tests
        run: make test

      - name: Run JavaScript tests
        run: make testjs

      - name: Build Web-Decker
        run: make web-decker
